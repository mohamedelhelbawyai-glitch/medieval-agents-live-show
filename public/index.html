<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="pane">
    <div id="wrap">
      <div id="box">
        <canvas id="stage"></canvas>
        <div id="overlay"></div>
        <div id="hud"><span id="clock">DAY 1 09:00</span></div>
        <div id="empty">NO AGENTS IN THE REALM YET<small>Send events to /event or press DEMO</small></div>
      </div>
    </div>
    <div id="zoom"><button id="zIn" title="Zoom in">+</button><button id="zOut" title="Zoom out">&minus;</button><button id="zFit" title="Fit the whole town">FIT</button></div>
  </main>
  <aside id="side">
    <header>
      <h1>AGENT REALM</h1>
      <div class="row"><span id="live" class="badge off">OFFLINE</span><button id="demoBtn">DEMO &#9654;</button></div>
    </header>
    <section class="stats">
      <div><b id="sAgents">0</b><span>AGENTS</span></div>
      <div><b id="sEvents">0</b><span>EVENTS</span></div>
      <div><b id="sErrors">0</b><span>FAILS</span></div>
    </section>
    <nav id="menu">
      <button data-view="logs"><span>LOGS</span><em id="cLogs">0</em></button>
      <button data-view="tasks"><span>TASKS</span><em id="cTasks">0</em></button>
      <button data-view="agents"><span>AGENTS</span><em id="cAgents">0</em></button>
    </nav>
    <section id="view" hidden>
      <div class="viewbar"><button id="back">&#9664; MENU</button><h2 id="viewTitle"></h2></div>
      <div id="viewBody"></div>
    </section>
  </aside>
</div>
<script src="game.js"></script>
<script src="sim.js"></script>
</body>
</html>
